# Copy this file to .github/workflows/profile-stats.yml to keep assets/stats-*.svg current.
# It has to be added through the GitHub web UI or a token with the `workflow` scope.
name: Refresh profile stats

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_stats.py
      - name: Commit if the cards changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile stats [skip ci]"
          git push
